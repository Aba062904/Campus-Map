<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%; /* Ensure full height */
            overflow: hidden; /* Prevent scrollbars */
        }

        #logo {
    position: absolute; /* Use absolute positioning */
    top: 20px; /* Distance from the top */
    left: 20px; /* Distance from the left */
    z-index: 10; /* Make sure it appears above other elements */
}

#logo img {
    width: 350px; /* Set the desired width for the logo */
    height: 150px; /* Maintain aspect ratio */
}

        #mapContainer {
            position: relative;
            width: 100%; /* Full parent width */
            height: 100%; /* Full parent height */
            display: flex;
            justify-content: center; /* Center content */
            align-items: center; /* Center content */
        }

        #floorPlan {
            width: auto; /* Automatic width to maintain aspect ratio */
            height: 70%; /* Fill the height of the container */
            max-width: 100%;  /* Prevent overflow */
            object-fit: contain; /* Maintain aspect ratio */
            position: relative;
        }
        
        #searchContainer {
        position: absolute;
        top: 20px; /* Distance from the top */
        right: 20px; /* Distance from the right */
        z-index: 10; /* Place above the map */
      }

        #searchInput {
        padding: 10px;
        border-radius: 5px;
        width: 200px; /* Fixed width for input */
        height: 20px;
      }

      .path {
    position: absolute;
    width: 0; /* Initial width */
    height: 0; /* Initial height */
    border-left: 4px solid blue; /* Line color */
    border-top: 4px solid transparent; /* Top triangle */
    border-bottom: 4px solid transparent; /* Bottom triangle */
    z-index: 5; /* Ensure the path is above the map */
    /* Position the path depending on your layout */
    left: 20%; /* Starting point of the path */
    top: 40%; /* Starting point of the path */
    height: 100px; /* Adjust height based on your path */
    transform: rotate(45deg); /* Rotate to make it diagonal */
}

/* Additional adjustments for better visuals, this can be customized further */
.path::after {
    content: '';
    position: absolute;
    top: 100%; /* Position it below the main line */
    left: -50%; /* Align end of line towards the bottom */
    border-left: 4px solid blue; /* Continuation of the blue line */
    width: 150px; /* Length of the path */
    height: 0;
}

    </style>
</head>
<body>
  <h1 id="logo">
    <img src="Landforms Map Science Game Presentation in Pastel Fun Style (3).jpg" alt="logo">
</h1>

    <div id="mapContainer">
        <img id="floorPlan" src="map campus.jpg.jpg" alt="Campus Map"/>
        
        <div class="marker" style="left: 100px; top: 150px;" title="Main Building" data-info="Main Building: Admin and Classes"></div>
        <div class="marker" style="left: 300px; top: 200px;" title="Library" data-info="Library: Books and Study Rooms"></div>
        <div class="marker" style="left: 500px; top: 250px;" title="Cafeteria" data-info="Cafeteria: Food and Beverages"></div>
    </div>

    <div class="marker" style="left: 10%; top: 25%;" title="Main Building" data-info="Main Building: Admin and Classes" data-location="Main Building">MB</div>
    <div class="marker" style="left: 40%; top: 30%;" title="Library" data-info="Library: Books and Study Rooms" data-location="Library">LIB</div>
    <div class="marker" style="left: 70%; top: 40%;" title="Cafeteria" data-info="Cafeteria: Food and Beverages" data-location="Cafeteria">CAF</div>
    
    <script src="script.js"></script>

    <!-- Existing markers -->
    <!-- Markers for each location -->
    <div class="marker" style="left: 5%; top: 90%;" title="Entrance" data-location="Entrance">E</div>
    <div class="marker" style="left: 40%; top: 30%;" title="Del Pilar Building" data-location="Del Pilar">DP</div>
    <div class="marker" style="left: 50%; top: 30%;" title="Bonifacio Building" data-location="Bonifacio">B</div>
    <div class="marker" style="left: 60%; top: 50%;" title="Mabini Building" data-location="Mabini">M</div>
    <div class="marker" style="left: 60%; top: 70%;" title="Gym" data-location="Gym">G</div>
    <div class="marker" style="left: 15%; top: 50%;" title="Rizal Building" data-location="Rizal">R</div>
    <div class="marker" style="left: 15%; top: 40%;" title="Centennial Garden" data-location="Centennial Garden">CG</div>
    <div id="controls">
      <button id="zoomIn">Zoom In</button>
      <button id="zoomOut">Zoom Out</button>
  </div>

  <div id="searchContainer">
    <input type="text" id="searchInput" placeholder="Search for a location..." />
</div>



</div>

<script>
  const floorPlan = document.getElementById('floorPlan');
  const zoomInButton = document.getElementById('zoomIn');
  const zoomOutButton = document.getElementById('zoomOut');
  let scale = 1; // Initial scale

  const locations = {
            "entrance": { x: 5, y: 90 },
            "mabini": { x: 60, y: 50 },
            "gym": { x: 60, y: 70 },
            "del pilar": { x: 40, y: 30 },
            "bonifacio": { x: 50, y: 30 },
            "rizal": { x: 15, y: 50 },
            "centennial garden": { x: 15, y: 40 },
        };

                // Function to draw the path
                function drawPath(start, end) {
            svgPath.innerHTML = ''; // Clear previous path
            const startCoords = locations[start.toLowerCase()];
            const endCoords = locations[end.toLowerCase()];

            if (startCoords && endCoords) {
                const pathData = `M${startCoords.x} ${startCoords.y} L${endCoords.x} ${endCoords.y}`;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathData);
                path.setAttribute("class", "path");
                svgPath.appendChild(path);
            }
        }

  // Function to zoom in
  function zoomIn() {
      scale += 0.1; // Increase scale
      floorPlan.style.transform = `scale(${scale})`; // Apply new scale
  }

  // Function to zoom out
  function zoomOut() {
      scale = Math.max(0.1, scale - 0.1); // Decrease scale but not below 0.1
      floorPlan.style.transform = `scale(${scale})`; // Apply new scale
  }

  // Add event listeners to buttons
  zoomInButton.addEventListener('click', zoomIn);
  zoomOutButton.addEventListener('click', zoomOut);

  // Optional: Zoom with mouse wheel
  mapContainer.addEventListener('wheel', function(event) {
      event.preventDefault();
      if (event.deltaY < 0) {
          zoomIn(); // Zoom in on scroll up
      } else {
          zoomOut(); // Zoom out on scroll down
      }
  });
  
  // Add event listeners to markers
  document.querySelectorAll('.marker').forEach(marker => {
      marker.addEventListener('click', function() {
          alert(this.getAttribute('data-info')); // Show information from data attribute
      });
  });

            // Search functionality
        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const pathMatch = query.match(/(entrance|del pilar|bonifacio|mabini|gym|rizal|centennial garden) to (.+)/);
            if (pathMatch) {
                const start = pathMatch[1]; // Get start location (e.g., entrance)
                const end = pathMatch[2].trim(); // Get end location (e.g., Mabini)
                drawPath(start, end);
            } else {
                svgPath.innerHTML = ''; // Clear path if query is not valid
            }
        });

</script>
</body>
</html>
